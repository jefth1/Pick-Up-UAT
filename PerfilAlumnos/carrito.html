<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://gdexcnbivhxqkfryoygf.supabase.co; connect-src 'self' https://gdexcnbivhxqkfryoygf.supabase.co wss://gdexcnbivhxqkfryoygf.supabase.co; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tu pedido · Pick Up UAT</title>
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pick Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../Compartido/img/iconos/favicon-32.png">
  <link rel="apple-touch-icon" href="../Compartido/img/iconos/apple-touch-icon.png">
  <script src="../Compartido/js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../Compartido/vendor/leaflet-1.9.4/leaflet.css">
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="../Compartido/css/mapa.css">
  <link rel="stylesheet" href="css/alumnos.css">
  <script src="../Compartido/vendor/supabase-js-2.117.0/supabase.js" defer></script>
  <script src="../Compartido/vendor/leaflet-1.9.4/leaflet.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/iconos.js" defer></script>
  <script src="../Compartido/js/mapa.js" defer></script>
  <script src="js/alumnos.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <header class="encabezado-pantalla">
      <div class="titulo-con-atras"><a class="atras" id="volver-carrito" href="explorar-locales.html" aria-label="Volver"><i data-icono="atras"></i></a><h1>Tu pedido</h1></div>
      <p class="texto-suave" id="local-carrito"></p>
    </header>
    <ul id="carrito" class="tarjeta lista-carrito"></ul>
    <a class="enlace agregar-mas" id="agregar-mas" href="explorar-locales.html" hidden><i data-icono="mas"></i>Agregar más productos</a>
    <section class="seccion-hora" id="seccion-hora" hidden>
      <h2>Hora de recogida</h2>
      <label class="campo-hora" id="caja-hora">
        <i data-icono="reloj"></i>
        <input type="time" id="hora" step="300" required aria-label="Hora de recogida">
        <i data-icono="abajo" class="flecha"></i>
      </label>
      <p class="aviso-hora" id="aviso-hora" role="status" hidden></p>
    </section>
    <section class="seccion-entrega" id="seccion-entrega" hidden>
      <h2>¿Cómo lo recibes?</h2>
      <div class="segmentado">
        <label><input type="radio" name="entrega" value="recojo" checked>Paso yo por él</label>
        <label><input type="radio" name="entrega" value="favor">Que me lo lleven</label>
      </div>
      <p class="texto-tenue" id="motivo-sin-favor" hidden></p>
      <div class="datos-favor" id="datos-favor" hidden>
        <label class="campo-punto"><i data-icono="ubicacion"></i><select class="campo" id="punto-entrega" aria-label="Punto de entrega"></select></label>
        <div class="mapa mapa-ruta" id="mapa-favor"></div>
        <p class="cifras-ruta" id="ruta-favor" hidden></p>
        <p class="aviso-hora" id="aviso-favor" hidden></p>
        <input class="campo" id="referencia" maxlength="120" placeholder="Referencia, ej. mochila roja" aria-label="Referencia para encontrarte">
      </div>
    </section>
    <div class="barra-pagar" id="barra-pagar" hidden>
      <div class="total-barra"><span id="etiqueta-total">Total</span><strong id="total-carrito">$0</strong></div>
      <button class="boton boton-primario" id="continuar-pago" disabled>Ir a pagar</button>
    </div>
  </main>
</body>
</html>
