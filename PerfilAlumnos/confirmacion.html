<body>
  <main class="pantalla con-barra">
    <section class="confirmacion" id="pedido-actual" hidden>
      <span class="icono-exito"><i data-icono="check"></i></span>
      <h1 id="titulo-confirmacion">¡Pedido enviado!</h1>
      <p class="texto-suave" id="texto-qr">Muestra este código al recoger tu pedido.</p>
      <div class="tarjeta qr" id="caja-qr"><div id="codigo-pedido"></div><strong id="numero-pedido">#—</strong></div>
      <div class="tarjeta favor" id="favor-pedido" hidden></div>
      <ol class="tarjeta pasos" id="pasos"></ol>
      <p class="recoge"><i data-icono="reloj"></i>Recoge a las <b id="hora-recogida">—</b> · <span id="local-pedido"></span></p>
      <span class="estado" id="estado-pedido" hidden></span>
    </section>
    <h2 id="titulo-lista">Mis pedidos</h2>
    <ul id="mis-pedidos" class="lista"><li class="texto-suave">Cargando…</li></ul>
    <nav class="barra-inferior">
      <a href="explorar-locales.html"><i data-icono="inicio"></i>Inicio</a>
