<html lang="es">
<head>
  <meta charset="utf-8">

  <link rel="apple-touch-icon" href="../Compartido/img/iconos/apple-touch-icon.png">
  <script src="../Compartido/js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="../Compartido/css/mapa.css">

  <script src="../Compartido/js/mapa.js" defer></script>
  <script src="js/alumnos.js" defer></script>
</head>
<body>
  <main class="pantalla con-barra">
    <header class="encabezado-pantalla">
      <h1>Mapa de la UAT</h1>
      <p class="texto-suave">Centro Universitario Tampico-Madero: facultades, zonas y dónde comer.</p>
    </header>
    <div class="chips" id="filtros-mapa">
      <button class="chip activo" data-capa="todo">Todo</button>
      <button class="chip" data-capa="facultad"><span class="punto-leyenda facultad"></span>Facultades</button>
      <button class="chip" data-capa="zona"><span class="punto-leyenda zona"></span>Zonas</button>
      <button class="chip" data-capa="local"><span class="punto-leyenda local"></span>Dónde comer</button>
    </div>
    <div class="mapa mapa-grande" id="mapa-uat">
      <button class="boton-mapa" id="mi-ubicacion" aria-label="Ver dónde estoy" title="Ver dónde estoy"><i data-icono="mira"></i></button>
    </div>
    <section class="tarjeta lugar-elegido" id="lugar-elegido" hidden></section>
    <ul class="lista lista-lugares" id="lista-lugares"><li class="texto-suave">Cargando…</li></ul>
    <nav class="barra-inferior">
      <a href="explorar-locales.html"><i data-icono="inicio"></i>Inicio</a>
      <a href="mapa.html" class="actual"><i data-icono="mapa"></i>Mapa</a>
      <a href="confirmacion.html"><i data-icono="bolsa"></i>Mis pedidos</a>
      <a href="../PerfilFavores/inicio.html"><i data-icono="ubicacion"></i>Favores</a>
      <a href="../Acceso/alumno-datos-uat.html"><i data-icono="usuario"></i>Perfil</a>
    </nav>
  </main>
