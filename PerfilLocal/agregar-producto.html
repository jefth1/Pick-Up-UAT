<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo producto · Pick Up UAT</title>
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="css/local.css">
  <script src="../Compartido/js/datos-demo.js" defer></script>
  <script src="../Compartido/js/estados-pedido.js" defer></script>
  <script src="js/local.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <h1>Nuevo producto</h1>
    <form class="formulario">
      <label class="subir-foto">Tomar o subir foto <input type="file" accept="image/*" capture="environment"></label>
      <label>Nombre <input class="campo" required></label>
      <label>Precio <input class="campo" type="number" min="0" step="0.5" required></label>
      <label>Categoría <input class="campo"></label>
      <label>Descripción <textarea class="campo"></textarea></label>
      <label class="interruptor"><input type="checkbox" checked> Disponible</label>
      <button class="boton boton-primario">Guardar y publicar</button>
    </form>
  </main>
</body>
</html>
