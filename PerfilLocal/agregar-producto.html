<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo producto · Pick Up UAT</title>
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="css/local.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/estados-pedido.js" defer></script>
  <script src="js/local.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <h1>Nuevo producto</h1>
    <form class="formulario" id="form-producto">
      <label>Nombre <input class="campo" name="nombre" required maxlength="80"></label>
      <label>Precio <input class="campo" name="precio" type="number" min="0" step="0.5" required></label>
      <label>Categoría <input class="campo" name="categoria" maxlength="40"></label>
      <label>Descripción <textarea class="campo" name="descripcion" maxlength="300"></textarea></label>
      <label class="interruptor"><input type="checkbox" name="disponible" checked> Disponible</label>
      <button class="boton boton-primario">Guardar y publicar</button>
    </form>
  </main>
</body>
</html>
