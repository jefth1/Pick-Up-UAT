<div style="margin:0;padding:32px 16px;background:#FAFAF8;font-family:Inter,Arial,Helvetica,sans-serif;color:#141414;">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border:1px solid #E8E8E4;border-radius:16px;padding:32px 24px;">
    <div style="width:48px;height:42px;line-height:42px;border-radius:12px;background:#1B3A6B;color:#FFFFFF;font-weight:700;font-size:18px;text-align:center;">PU</div>
    <h1 style="margin:24px 0 8px;font-size:22px;line-height:1.2;">Verifica tu correo</h1>
    <p style="margin:0 0 20px;color:#6E6E6A;font-size:15px;line-height:1.4;">Escribe este código en Pick Up UAT para activar tu cuenta:</p>
    <p style="margin:0 0 24px;padding:16px;border-radius:12px;background:#EEF2F8;color:#1B3A6B;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;">{{ .Token }}</p>
    <p style="margin:0 0 8px;color:#6E6E6A;font-size:14px;line-height:1.4;">O verifica con un toque:</p>
    <p style="margin:0 0 24px;"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}" style="display:inline-block;padding:12px 20px;border-radius:12px;background:#1B3A6B;color:#FFFFFF;font-weight:600;text-decoration:none;">Verificar mi correo</a></p>
    <p style="margin:0;color:#A3A39E;font-size:13px;line-height:1.4;">El código vence en una hora. Si tú no creaste una cuenta en Pick Up UAT, ignora este correo.</p>
  </div>
</div>
