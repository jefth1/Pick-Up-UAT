<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crea tu cuenta · Pick Up UAT</title>
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pick Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../Compartido/img/iconos/favicon-32.png">
  <link rel="apple-touch-icon" href="../Compartido/img/iconos/apple-touch-icon.png">
  <script src="../Compartido/js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/iconos.js" defer></script>
  <script src="../Compartido/js/acceso.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <header class="encabezado-pantalla">
      <div class="titulo-con-atras"><a class="atras" href="bienvenida.html" aria-label="Volver"><i data-icono="atras"></i></a><h1>Crea tu cuenta</h1></div>
      <p class="texto-suave">Mientras conectamos la cuenta UAT, regístrate aquí una sola vez.</p>
    </header>
    <form class="formulario" id="form-registro-alumno">
      <label class="campo-grupo">Nombre completo <input class="campo" name="nombre" required maxlength="120" autocomplete="name" placeholder="Como aparece en tu credencial"></label>
      <label class="campo-grupo">Matrícula <input class="campo" name="matricula" required maxlength="20" placeholder="Ej. a2210000"></label>
      <label class="campo-grupo">Correo institucional <input class="campo" type="email" name="correo" required maxlength="120" autocomplete="email" placeholder="matricula@alumnos.uat.edu.mx"></label>
      <label class="campo-grupo">Facultad <input class="campo" name="facultad" maxlength="120" placeholder="Ej. Facultad de Ingeniería"></label>
      <label class="campo-grupo">Carrera <input class="campo" name="carrera" maxlength="120" placeholder="Ej. Ing. en Sistemas Computacionales"></label>
      <label class="campo-grupo">Crea una contraseña <input class="campo" type="password" name="contrasena" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>
      <p class="mensaje" id="mensaje" hidden></p>
      <div class="acciones-abajo">
        <button class="boton boton-primario">Crear cuenta</button>
        <p class="pie">¿Ya tienes cuenta? <a href="alumno-iniciar-sesion.html">Inicia sesión</a></p>
      </div>
    </form>
  </main>
</body>
</html>
