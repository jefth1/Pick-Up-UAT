<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión (local) · Pick Up UAT</title>
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/acceso.js" defer></script>

</head>
<body>
  <main class="pantalla">
    <h1>Entrar como local</h1>
    <form class="formulario" id="form-entrar">
      <label>Correo <input class="campo" type="email" name="correo" required autocomplete="email"></label>
      <label>Contraseña <input class="campo" type="password" name="contrasena" required autocomplete="current-password"></label>
      <button class="boton boton-primario">Entrar</button>
    </form>
    <p class="texto-suave" id="mensaje" hidden></p>
    <a href="#" id="olvide">¿Olvidaste tu contraseña?</a>
    <a href="local-registro.html">Registrar mi local</a>
  </main>
</body>
</html>
