<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar como local · Pick Up UAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/iconos.js" defer></script>
  <script src="../Compartido/js/acceso.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <header class="encabezado-pantalla">
      <div class="titulo-con-atras"><a class="atras" href="bienvenida.html" aria-label="Volver"><i data-icono="atras"></i></a><h1>Entrar como local</h1></div>
      <p class="texto-suave">Accede al panel de tu negocio.</p>
    </header>
    <form class="formulario" id="form-entrar">
      <label class="campo-grupo">Correo del negocio <input class="campo" type="email" name="correo" required autocomplete="email" placeholder="contacto@milocal.com"></label>
      <label class="campo-grupo">Contraseña <input class="campo" type="password" name="contrasena" required autocomplete="current-password" placeholder="••••••••"></label>
      <a href="#" class="enlace" id="olvide">¿Olvidaste tu contraseña?</a>
      <p class="mensaje" id="mensaje" hidden></p>
      <div class="acciones-abajo">
        <button class="boton boton-primario">Iniciar sesión</button>
        <p class="pie">¿Aún no registras tu local? <a href="local-registro.html">Regístralo</a></p>
      </div>
    </form>
  </main>
</body>
</html>
