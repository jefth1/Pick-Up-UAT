<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tus datos UAT · Pick Up UAT</title>
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/acceso.js" defer></script>

</head>
<body>
  <main class="pantalla">
    <h1 id="saludo">¡Hola!</h1>
    <p class="texto-suave" id="aviso-datos">Cargando tus datos…</p>
    <dl class="tarjeta datos-solo-lectura" id="datos-alumno" hidden></dl>
    <a class="boton boton-primario" id="continuar" href="../PerfilAlumnos/explorar-locales.html" hidden>Confirmar y continuar</a>

    <!-- Mientras no exista el inicio de sesión UAT, el alumno llena sus datos una vez. -->
    <form class="formulario" id="form-alumno" hidden>
      <label>Nombre completo <input class="campo" name="nombre" required maxlength="120"></label>
      <label>Matrícula <input class="campo" name="matricula" required maxlength="20"></label>
      <label>Correo institucional <input class="campo" type="email" name="correo" maxlength="120" placeholder="a2213450123@alumnos.uat.edu.mx"></label>
      <label>Facultad <input class="campo" name="facultad" maxlength="120"></label>
      <label>Carrera <input class="campo" name="carrera" maxlength="120"></label>
      <button class="boton boton-primario">Guardar y continuar</button>
    </form>
  </main>
</body>
</html>
