<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nueva contraseña · Pick Up UAT</title>
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pick Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../Compartido/img/iconos/favicon-32.png">
  <link rel="apple-touch-icon" href="../Compartido/img/iconos/apple-touch-icon.png">
  <script src="../Compartido/js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../Compartido/css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="../Compartido/js/supabase.js" defer></script>
  <script src="../Compartido/js/iconos.js" defer></script>
  <script src="../Compartido/js/acceso.js" defer></script>
</head>
<body>
  <main class="pantalla">
    <header class="encabezado-pantalla">
      <div class="titulo-con-atras"><a class="atras" id="atras" href="alumno-iniciar-sesion.html" aria-label="Volver"><i data-icono="atras"></i></a><h1>Nueva contraseña</h1></div>
      <p class="texto-suave" id="texto-contrasena">Escribe la contraseña que usarás para entrar.</p>
    </header>
    <form class="formulario" id="form-nueva-contrasena" hidden>
      <label class="campo-grupo">Nueva contraseña <input class="campo" type="password" name="contrasena" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>
      <p class="mensaje" id="mensaje" hidden></p>
      <div class="acciones-abajo">
        <button class="boton boton-primario">Guardar y entrar</button>
      </div>
    </form>
    <div class="formulario" id="sin-enlace" hidden>
      <p class="mensaje error" id="mensaje-enlace">Este enlace ya venció o ya se usó. Pide otro desde «¿Olvidaste tu contraseña?».</p>
      <div class="acciones-abajo">
        <a class="boton boton-primario" id="pedir-otro" href="alumno-iniciar-sesion.html">Volver a iniciar sesión</a>
      </div>
    </div>
  </main>
</body>
</html>
